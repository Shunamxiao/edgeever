name: Deploy EdgeEver (Fork)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: edgeever-fork-production
  cancel-in-progress: true

jobs:
  deploy:
    # Runs only in deployment forks. Upstream guard reference:
    # github.repository == 'tianma-if/edgeever'
    if: github.repository != 'tianma-if/edgeever'
    name: Build and Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_EMAIL: "${{ secrets.CLOUDFLARE_EMAIL }}"
      CLOUDFLARE_API_KEY: "${{ secrets.CLOUDFLARE_API_KEY }}"
      CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
      EDGE_EVER_D1_DATABASE_ID: e6962900-7c67-491c-a6cc-c4d667e291c8
      EDGE_EVER_D1_DATABASE_NAME: edgeever
      EDGE_EVER_R2_BUCKET_NAME: edgeever-resources
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: edgeever-resources-preview
      EDGE_EVER_AUTH_USERNAME: "${{ secrets.EDGE_EVER_AUTH_USERNAME }}"
      EDGE_EVER_AUTH_PASSWORD: "${{ secrets.EDGE_EVER_AUTH_PASSWORD }}"
      EDGE_EVER_SESSION_TTL_DAYS: "400"
      EDGE_EVER_WORKER_NAME: edgeever
      EDGE_EVER_DEPLOYMENT_TRIGGER: github_actions_push
      EDGE_EVER_DEPLOYMENT_METHOD: github_actions

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Repair stale patch context (expo-sharing)
        run: |
          set -euo pipefail
          f='patches/expo-sharing@57.0.22.patch'
          if grep -q '^@@ -46,10 +46,27 @@' "$f"; then
            echo "patch already repaired"
            exit 0
          fi
          # expo-sharing@57.0.22 ships a blank line before the patched return
          # statement; the upstream patch context predates it, so bun's
          # --frozen-lockfile apply fails with "hunk #1 does not apply".
          python3 - "$f" <<'EOS'
          import sys
          path = sys.argv[1]
          src = open(path, encoding='utf-8').read()
          old_hdr = '@@ -47,9 +47,26 @@'
          rem = '-  return intent.type != null && allowedShareActions.contains(intent.action)'
          if old_hdr not in src or rem not in src:
              sys.exit('unexpected patch layout; refusing to rewrite')
          src = src.replace(old_hdr, '@@ -46,10 +46,27 @@', 1)
          src = src.replace(rem, ' \n' + rem, 1)
          open(path, 'w', encoding='utf-8').write(src)
          EOS
          grep -q '^@@ -46,10 +46,27 @@' "$f"
          echo "repaired $f"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_EMAIL: "${{ secrets.CLOUDFLARE_EMAIL }}"
          CLOUDFLARE_API_KEY: "${{ secrets.CLOUDFLARE_API_KEY }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CF_ACCOUNT_ID }}"
        run: bun run deploy:cloudflare-builds
